[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A formula (not a cask) in our own tap: `brew install yrangana/tap/fm-mcp`
tap = "yrangana/homebrew-tap"
# Push the formula to the tap on release (needs the HOMEBREW_TAP_TOKEN secret)
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# Apple Silicon only: the on-device model needs it (see AGENTS.md)
targets = ["aarch64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Ship only fm-mcp; fake-fm is the test double for `fm serve`.
[dist.binaries]
aarch64-apple-darwin = ["fm-mcp"]
