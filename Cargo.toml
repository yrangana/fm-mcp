[package]
name = "fm-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server that lets coding agents delegate simple, private work to the on-device model for Apple Foundation Models (macOS 27)"
authors = ["Yasiru Rangana <yrangana@gmail.com>"]
license = "MIT"
repository = "https://github.com/yrangana/fm-mcp"
homepage = "https://github.com/yrangana/fm-mcp"
readme = "README.md"
keywords = ["mcp", "llm", "on-device", "macos", "claude"]
categories = ["command-line-utilities", "development-tools"]
# What goes into a crates.io package. tests/ is needed for the fake-fm bin target.
include = ["/src", "/tests", "/skills", "/snippets", "/LICENSE", "/README.md"]

[features]
# Builds the `fake-fm` test binary used by the integration tests.
# Run tests with `cargo test --features fake-fm`.
fake-fm = ["hyper/server"]

[[bin]]
name = "fm-mcp"
path = "src/main.rs"

[[bin]]
name = "fake-fm"
path = "tests/fake_fm/fake_fm.rs"
required-features = ["fake-fm"]
test = false

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.31", features = ["process", "signal", "user"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: `install` edits ~/.claude.json without reordering its keys.
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.27"
thiserror = "2"
toml_edit = "0.25"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "io-std", "net", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
